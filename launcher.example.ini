; rflauncher settings. Point Host at your server; the rest can stay as-is.
; ClientDir empty = the folder this launcher sits in (copy it into your RF client).

[Game]
; Which RF episode this client is. It picks the connection port and the
; login handoff format, so it has to match the client you are running.
;   455 | 415 | 15 | 2232 | 216 | 215 | giga4 | 105
Version      = 455

[Server]
Host         = 172.23.123.86
; Advanced: Version sets these. Uncomment only if you changed SERVICE_PORT
; in the server's settings.cfg.
; GamePort     = 27830
; AuthPort     = 27831

[Client]
ClientDir    = 
ClientBinary = RF_Online.bin

[Credentials]
Remember     = true
Email        = seu-email@exemplo.com
Password     = SENHA_CONFIGURAR_LOCALMENTE

[National]
; The client's language/region. It picks the DataTable language folder AND the
; item-name and cash-shop price columns, so it has to match what your server
; serves. This emulator is built and tested against GB.
;   KR BR CN GB ID JP PH RU TW US TH   (-1 = this game version's own default)
; List several to accept them all without a warning, e.g. GB,RU. The FIRST is
; the one written into the client.
NationCode   = BR

[Update]
; The server's website, e.g. https://rf.example.com. The launcher checks it for
; updated client files before starting the game. Leave EMPTY to never check.
URL          = 
